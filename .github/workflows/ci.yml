name: TradeFlow Lakehouse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Format check
        run: |
          black --check tradeflow tests
          isort --check-only tradeflow tests

      - name: Lint
        run: flake8 tradeflow tests --max-line-length=100

      - name: Tests
        run: pytest tests -v --cov=tradeflow --cov-report=term-missing
